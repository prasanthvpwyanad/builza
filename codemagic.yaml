workflows:
  builza-android-apk:
    name: Builza Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Builza release APK
        script: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Builza.apk
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  builza-macos:
    name: Builza macOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Enable macOS desktop
        script: flutter config --enable-macos-desktop
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build Builza macOS app
        script: flutter build macos --release
      - name: Zip Builza.app
        script: |
          APP_PATH=$(find "$CM_BUILD_DIR/build/macos" -name "Builza.app" | head -n 1)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$CM_BUILD_DIR/Builza-macos.zip"
    artifacts:
      - Builza-macos.zip
      - build/macos/**/*.app

  builza-ios:
    name: Builza iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build iOS app
        script: flutter build ios --release --no-codesign
      - name: Package Builza.ipa
        script: |
          APP_PATH=$(find "$CM_BUILD_DIR/build/ios/iphoneos" -maxdepth 1 -name "*.app" | head -n 1)
          rm -rf "$CM_BUILD_DIR/Payload"
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR"
          zip -r Builza.ipa Payload
    artifacts:
      - Builza.ipa
      - build/ios/iphoneos/*.app
